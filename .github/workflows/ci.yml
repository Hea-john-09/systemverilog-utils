name: CI

on:
  push:
  pull_request:

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run package:vsix -- --out systemverilog-utils.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: systemverilog-utils-vsix
          path: systemverilog-utils.vsix
